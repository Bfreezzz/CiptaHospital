<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PT Cipta Hospital INA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 3rem;
      color: #007bff;
      margin-bottom: 20px;
      animation: slideDown 1s ease-out;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 40px;
      line-height: 1.6;
      animation: slideUp 1s ease-out;
    }

    .btn {
      display: inline-block;
      background: #007bff;
      color: #fff;
      padding: 12px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      text-decoration: none;
      transition: background 0.3s ease;
      animation: fadeIn 2s ease;
    }

    .btn:hover {
      background: #0056b3;
    }

    footer {
      margin-top: 60px;
      font-size: 0.9rem;
      color: #777;
      animation: fadeIn 3s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Selamat Datang di PT Cipta Hospital INA</h1>
  <p>
    Kami menyediakan layanan kesehatan profesional dan modern dengan tenaga medis yang berpengalaman dan fasilitas terbaik untuk keluarga Anda.
  </p>
  <a href="#!" class="btn">Lihat Layanan Kami</a>

  <footer>
    &copy; 2025 PT Cipta Hospital INA. All rights reserved.
  </footer>
</body>
</html>
